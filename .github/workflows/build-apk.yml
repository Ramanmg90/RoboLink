name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates android/, adds INTERNET permission + cleartext HTTP, runs pub get
      - name: Setup project
        run: bash tool/setup.sh

      # Remove continue-on-error once these pass, so failures block the build.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robolink-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
